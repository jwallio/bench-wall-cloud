name: Build and deploy

on:
  schedule:
    # 11:40 UTC = 6:40 a.m. Eastern (7:40 in summer), after dynamical.org's daily scorecard update
    - cron: '40 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', 'scripts/**', 'wrangler.jsonc', 'requirements.txt', '.github/workflows/deploy.yml']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      # Observation years (about 200 MB) and the compiled kernel. A cold run rebuilds them in a few minutes;
      # warm runs only re-read the current year.
      - name: Restore data cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: bench-cache-${{ github.run_id }}
          restore-keys: bench-cache-

      - name: Build site and data
        run: bash scripts/build.sh

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
